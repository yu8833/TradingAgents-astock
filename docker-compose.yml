services:
  tradingagents:
    build:
      context: .
      cache_from:
        - python:3.12-slim
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true
    profiles:
      - cli
    command: ["tradingagents"]

  tradingagents-web:
    build:
      context: .
      cache_from:
        - python:3.12-slim
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    ports:
      - "8501:8501"
    tty: true
    stdin_open: true
    profiles:
      - web
    entrypoint: ["python", "-m", "streamlit", "run"]
    command: ["/home/appuser/app/web/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build:
      context: .
      cache_from:
        - python:3.12-slim
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
